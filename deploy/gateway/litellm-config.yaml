# FALLBACK ONLY — LiteLLM proxy config for the local Cisco AI Defense gateway.
# Runs on the upstream image ghcr.io/berriai/litellm:main-v1.100.0, whose guardrail hooks include
# `cisco_ai_defense` (litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/).
# Agents point NIM_LLM_BASE_URL at http://ai-defense-gateway:4000/v1 and present
# LITELLM_MASTER_KEY as NVIDIA_API_KEY. Every chat completion is inspected by the
# Cisco AI Defense Inspection API before (pre_call) and after (post_call) the NIM.
model_list:
  - model_name: nvidia/nemotron-3.5-lightning          # the name the agents ask for (NIM_LLM_MODEL_NAME)
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning       # OpenAI-compatible upstream = the local NIM
      api_base: http://nemotron-lightning:8000/v1
      api_key: "none"

guardrails:
  - guardrail_name: cisco-ai-defense-chat
    litellm_params:
      guardrail: cisco_ai_defense
      mode: [pre_call, post_call]
      default_on: true
      api_key: os.environ/CISCO_AI_DEFENSE_API_KEY      # inspection API key from the AI Defense console
      api_base: os.environ/CISCO_AI_DEFENSE_API_BASE    # https://us.api.inspect.aidefense.security.cisco.com
      inspection_type: chat
      on_flagged_action: block                          # block | monitor
      fallback_on_error: block                          # fail closed
      timeout: 10

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
