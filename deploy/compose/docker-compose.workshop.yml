# =============================================================================
# Agentic Observability with NVIDIA — workshop overlay
# =============================================================================
# Applied as an EXTRA compose file on top of the blueprint's own three files.
# The blueprint checkout (NVIDIA-AI-Blueprints/Retail-Agentic-Commerce v1.0.0)
# is never edited; `git diff` inside it stays empty.
#
#   export WORKSHOP_DIR=/opt/AgenticObservabilityWithNvidia
#   cd /opt/Retail-Agentic-Commerce
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml -f docker-compose-nim.yml \
#                  -f "$WORKSHOP_DIR/deploy/compose/docker-compose.workshop.yml" up -d --build
#
# Paths are absolute via ${WORKSHOP_DIR} on purpose: relative paths in an
# overlay resolve against the project directory of the FIRST -f file.
#
# What this overlay does:
#   (a)+(c) mounts the four workshop agent YAMLs over /app/configs (adds the
#           Splunk AO and otelcollector exporters + a file logger),
#   (c)     adds the OpenTelemetry Collector that forwards spans + agent logs
#           to Splunk HEC,
#   (b)     nothing — Cisco AI Defense is a base-URL swap done in .env.workshop
#           (NIM_LLM_BASE_URL / NVIDIA_API_KEY). The optional `local-gateway`
#           profile provides the fallback gateway container.
# =============================================================================

services:
  # ---- (a)+(c) the four NAT agents: workshop configs + secrets + log volume ----
  promotion-agent:
    volumes:
      - ${WORKSHOP_DIR:?set WORKSHOP_DIR to this repo's checkout}/deploy/agents/configs:/app/configs:ro
      - acp-workshop-logs:/app/logs
    env_file:
      - ${WORKSHOP_DIR}/deploy/.env.workshop
    depends_on:
      otel-collector:
        condition: service_started

  post-purchase-agent:
    volumes:
      - ${WORKSHOP_DIR}/deploy/agents/configs:/app/configs:ro
      - acp-workshop-logs:/app/logs
    env_file:
      - ${WORKSHOP_DIR}/deploy/.env.workshop
    depends_on:
      otel-collector:
        condition: service_started

  recommendation-agent:
    volumes:
      - ${WORKSHOP_DIR}/deploy/agents/configs:/app/configs:ro
      - acp-workshop-logs:/app/logs
    env_file:
      - ${WORKSHOP_DIR}/deploy/.env.workshop
    depends_on:
      otel-collector:
        condition: service_started

  search-agent:
    volumes:
      - ${WORKSHOP_DIR}/deploy/agents/configs:/app/configs:ro
      - acp-workshop-logs:/app/logs
    env_file:
      - ${WORKSHOP_DIR}/deploy/.env.workshop
    depends_on:
      otel-collector:
        condition: service_started

  # ---- (c) OpenTelemetry Collector: OTLP + agent log files -> Splunk HEC ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ${WORKSHOP_DIR}/deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - acp-workshop-logs:/app/logs:ro
      - acp-otel-storage:/var/lib/otelcol
    env_file:
      - ${WORKSHOP_DIR}/deploy/.env.workshop
    expose:
      - "4317"
      - "4318"
      - "8888"
    networks:
      - acp-network
      - acp-infra-network
    restart: unless-stopped

  # ---- (b) FALLBACK ONLY: local Cisco AI Defense gateway (LiteLLM proxy) ------
  # Enabled with `--profile local-gateway` when the tenant cannot front the
  # self-hosted NIM through the hosted AI Defense Gateway. Then set
  #   NIM_LLM_BASE_URL=http://ai-defense-gateway:4000/v1
  #   NVIDIA_API_KEY=${LITELLM_MASTER_KEY}
  ai-defense-gateway:
    profiles: ["local-gateway"]
    image: ghcr.io/berriai/litellm:main-v1.100.0   # upstream LiteLLM carries the cisco_ai_defense guardrail hook
    container_name: ai-defense-gateway
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ${WORKSHOP_DIR}/deploy/gateway/litellm-config.yaml:/app/config.yaml:ro
    env_file:
      - ${WORKSHOP_DIR}/deploy/.env.workshop
    expose:
      - "4000"
    networks:
      - acp-network
      - acp-infra-network
      - acp-nim-network
    restart: unless-stopped

  # ---- NIM placement on ONE L40S (g6e.4xlarge, 48 GB) ---------------------------
  # The blueprint pins Lightning to GPU 0 and Embed to GPU 1. A g6e.4xlarge has a
  # single L40S, so both NIMs share GPU 0: the embed NIM (~4 GB) becomes healthy
  # first, then Lightning starts on its W4A16 profile with its KV cache capped
  # (NIM_KVCACHE_PERCENT) so it leaves the embed NIM alone.
  # Validate on first boot: `nvidia-smi` shows both processes on GPU 0 and both
  # /v1/health/ready endpoints return 200. Lightning OOMs -> lower the percent;
  # Lightning starved of KV cache -> raise it toward 0.8.
  # `!override` replaces the blueprint's device list instead of appending to it
  # (Docker Compose >= 2.24).
  embedqa:
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  nemotron-lightning:
    environment:
      - NIM_KVCACHE_PERCENT=${NIM_KVCACHE_PERCENT:-0.6}
    depends_on:
      embedqa:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

volumes:
  acp-workshop-logs:
    name: acp-workshop-logs
  acp-otel-storage:
    name: acp-otel-storage
