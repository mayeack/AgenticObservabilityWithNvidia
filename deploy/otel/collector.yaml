# OpenTelemetry Collector (contrib 0.157.0) for the workshop overlay.
#   traces : OTLP from the four NAT agents (exporter `splunk_core`) -> Splunk HEC (sourcetype otel:traces)
#   logs   : the agents' NAT file logs from the shared volume       -> Splunk HEC (sourcetype acp:<agent>)
# Values come from deploy/.env.workshop (injected by compose env_file).
# Notes carried over from the previous workshop's verified config:
#   - `max_connections` no longer exists on splunk_hec; do not add it.
#   - a `com.splunk.index` resource attribute overrides the exporter's `index`, so stamp it in `resource/workshop`.
#   - do NOT filter on gen_ai.operation.name: NAT spans use OpenInference attributes.

extensions:
  file_storage/checkpoints:
    directory: /var/lib/otelcol
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/agents:
    include: [/app/logs/*-agent.log]
    start_at: beginning
    include_file_name: true
    storage: file_storage/checkpoints
    operators:
      - type: regex_parser
        # NAT file logger lines: "2026-09-08 19:00:00,123 - nat.agent - INFO - message"
        regex: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<logger>[^ ]+) - (?P<sev>[A-Z]+) - (?P<msg>.*)$'
        on_error: send_quiet
        severity:
          parse_from: attributes.sev
      - type: add
        field: resource["com.splunk.sourcetype"]
        value: EXPR("acp:" + replace(attributes["log.file.name"], "-agent.log", ""))

processors:
  batch: {}
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
  # One identity everywhere: the storefront instance name (acp1, acp2, ...) is the
  # Splunk AO agent stream, the tunnel name, and deployment.environment here.
  resource/workshop:
    attributes:
      - { key: deployment.environment, value: "${env:WORKSHOP_ENVIRONMENT}", action: upsert }
      - { key: service.namespace,      value: "retail-agentic-commerce",     action: upsert }
      - { key: host.name,              value: "${env:WORKSHOP_ENVIRONMENT}", action: upsert }
      - { key: com.splunk.index,       value: "${env:SPLUNK_HEC_INDEX}",     action: upsert }
      - { key: com.splunk.source,      value: "${env:WORKSHOP_ENVIRONMENT}", action: upsert }

exporters:
  splunk_hec/traces:
    token: "${env:SPLUNK_HEC_TOKEN}"
    endpoint: "${env:SPLUNK_HEC_URL}"
    index: "${env:SPLUNK_HEC_INDEX}"
    source: "acp-agents"
    sourcetype: "otel:traces"
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage/checkpoints
  splunk_hec/logs:
    token: "${env:SPLUNK_HEC_TOKEN}"
    endpoint: "${env:SPLUNK_HEC_URL}"
    index: "${env:SPLUNK_HEC_INDEX}"
    source: "acp-agents"
    sourcetype: "acp:agent"          # overridden per file by com.splunk.sourcetype
    retry_on_failure:
      enabled: true
  # Optional fan-out for a realm-based Splunk AO tenant (instead of the agents'
  # direct `galileo` exporter). Uncomment and add to the traces pipeline.
  # otlphttp/splunk_ao:
  #   traces_endpoint: "https://ingest.${env:SPLUNK_AO_REALM}.observability.splunkcloud.com/v2/trace/otlp"
  #   headers:
  #     X-SF-Token: "${env:SPLUNK_AO_O11Y_TOKEN}"

service:
  extensions: [file_storage/checkpoints, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/workshop, batch]
      exporters: [splunk_hec/traces]
    logs:
      receivers: [filelog/agents]
      processors: [memory_limiter, resource/workshop, batch]
      exporters: [splunk_hec/logs]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
